# Ambiente de pruebas: GLPI 11.0.11 (imagen oficial) + MariaDB 10.11 con el plugin montado.
# Uso:  docker compose up -d   →   http://localhost:8080  (usuario glpi / clave glpi)
# Después: Configuración > Complementos > Actas de entrega > Instalar y Activar.
name: actasentrega
services:
  glpi:
    image: "glpi/glpi:11.0.11"
    restart: unless-stopped
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      GLPI_DB_HOST: db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi
    volumes:
      - glpi_data:/var/glpi
      # El plugin se monta en el directorio de plugins de la imagen.
      # Si la imagen cambia la ruta, ajústela (docker compose exec glpi ls /var/www/glpi).
      - ./:/var/www/glpi/plugins/actasentrega
  db:
    image: "mariadb:10.11"
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
    volumes:
      - db_data:/var/lib/mysql
volumes:
  glpi_data:
  db_data:
